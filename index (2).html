<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe4ec">
<title>¡Feliz cumple, Gaby! 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { script: ['"Dancing Script"', 'cursive'], body: ['Quicksand', 'system-ui', 'sans-serif'] },
    colors: { petal: '#ffe4ec', blush: '#ffc2d4', rosa: '#f472a0', berry: '#b83a6b', cocoa: '#5a2a3c' }
  } } };
</script>
<style>
  html, body { min-height: 100%; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif; color: #5a2a3c;
    background: radial-gradient(circle at 15% 10%, #fff0f5 0, transparent 45%),
                radial-gradient(circle at 85% 90%, #ffd6e4 0, transparent 50%), #ffe9f0;
    background-attachment: fixed;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }
  .screen { transition: opacity .7s ease, transform .7s ease, filter .7s ease; }
  .screen.leave { opacity: 0; transform: scale(1.06); filter: blur(8px); pointer-events: none; }
  .screen.pre-enter { opacity: 0; transform: translateY(24px) scale(.97); }
  .hidden-screen { display: none; }

  .bunting { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; padding-top: env(safe-area-inset-top); }
  .bunting::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: #f9a8c4; }
  .flag { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid; transform-origin: top center; animation: sway 3s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

  .floaty { position: fixed; bottom: -40px; pointer-events: none; opacity: 0; animation: rise linear forwards; z-index: 0; }
  @keyframes rise { 0% { transform: translateY(0) rotate(0); opacity: 0; } 12% { opacity: .75; } 100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }

  .key { height: 4rem; border-radius: 9999px; font-weight: 700; font-size: 1.5rem; background: rgba(255,255,255,.85);
    border: 2px solid #ffc2d4; color: #b83a6b; box-shadow: 0 4px 0 #ffc2d4; transition: transform .1s, box-shadow .1s, background .2s;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .key:active { transform: translateY(4px); box-shadow: 0 0 0 #ffc2d4; background: #ffd9e6; }
  .key:focus-visible, .gift:focus-visible, .btn:focus-visible, .close-btn:focus-visible, .candle-btn:focus-visible { outline: 3px solid #b83a6b; outline-offset: 3px; }
  .dot { width: 18px; height: 18px; border-radius: 9999px; border: 2px solid #f472a0; transition: all .2s; }
  .dot.on { background: #f472a0; transform: scale(1.2); }
  .shake { animation: shake .45s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }

  .frame { border: 4px solid #fff; box-shadow: 0 8px 22px rgba(184,58,107,.25); background: #ffd6e4; overflow: hidden; }
  .frame img { width: 100%; height: 100%; object-fit: cover; }

  .btn { background: #f472a0; color: #fff; font-weight: 700; border-radius: 9999px; padding: .7rem 1.4rem; box-shadow: 0 4px 0 #b83a6b; transition: transform .1s, box-shadow .1s; touch-action: manipulation; }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #b83a6b; }
  .btn.alt { background: #fff; color: #b83a6b; border: 2px solid #f9a8c4; box-shadow: 0 4px 0 #f9a8c4; }

  .gift { position: relative; width: 100%; border-radius: 1.6rem; padding: 1rem .75rem; background: rgba(255,255,255,.92);
    border: 2px dashed #f9a8c4; display: flex; flex-direction: column; align-items: center; gap: .15rem; text-align: center;
    transition: transform .25s, box-shadow .25s, opacity .3s; box-shadow: 0 10px 24px rgba(184,58,107,.15); }
  .gift:hover { transform: translateY(-3px) rotate(-.6deg); }
  .gift .box { font-size: 2.5rem; line-height: 1.1; display: inline-block; }
  .gift.opening .box { animation: wiggle .6s ease; }
  @keyframes wiggle { 0%,100% { transform: rotate(0) scale(1); } 20% { transform: rotate(-14deg) scale(1.15); } 40% { transform: rotate(12deg) scale(1.2); } 60% { transform: rotate(-8deg) scale(1.15); } 80% { transform: rotate(6deg) scale(1.1); } }
  .gift .badge { position: absolute; top: -10px; right: -6px; background: #f472a0; color: #fff; border-radius: 9999px; padding: 4px; display: none; }
  .gift.done .badge { display: block; }
  .gift.locked { opacity: .7; border-style: solid; border-color: #ffc2d4; }
  .gift.final { background: linear-gradient(135deg, #fff 0%, #ffe0ec 100%); border-color: #f472a0; }

  #modal { transition: opacity .3s ease; }
  #modal.show { opacity: 1; pointer-events: auto; }
  #modal .panel { transform: translateY(40px) scale(.94); transition: transform .45s cubic-bezier(.2,1.3,.4,1); }
  #modal.show .panel { transform: none; }

  .letter { background: repeating-linear-gradient(#fffdf8 0, #fffdf8 33px, #ffd9e6 34px); border-radius: 1rem; padding: 1.25rem 1.25rem 1rem; line-height: 34px; box-shadow: inset 0 0 0 2px #ffc2d4; }
  .pulse-heart { animation: pulse 1.4s ease-in-out infinite; display: inline-block; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }

  /* Pastel */
  .cake-top { width: 150px; height: 54px; background: #ffb3cd; border-radius: 16px 16px 6px 6px; margin: 0 auto; position: relative; }
  .cake-top::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 16px; border-radius: 16px 16px 40% 40%; background: #fff; }
  .cake-bot { width: 220px; height: 72px; background: #ff8fb5; border-radius: 10px 10px 20px 20px; margin: -2px auto 0; box-shadow: 0 10px 0 #fff, 0 12px 0 #f9a8c4; }
  .candles { display: flex; justify-content: center; gap: 14px; height: 70px; align-items: flex-end; margin-bottom: -2px; }
  .candle-btn { padding: 0 14px; height: 70px; display: flex; align-items: flex-end; touch-action: manipulation; }
  .candle { width: 10px; height: 34px; border-radius: 3px; background: repeating-linear-gradient(#fff 0 6px, #f472a0 6px 12px); position: relative; }
  .flame { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-size: 22px; animation: flick .35s infinite alternate; transform-origin: bottom; }
  @keyframes flick { from { transform: translateX(-50%) scale(1) rotate(-3deg); } to { transform: translateX(-50%) scale(1.12) rotate(3deg); } }
  .candle.out .flame { display: none; }
  .candle.out::after { content: "💨"; position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-size: 16px; animation: puff 1.2s forwards; }
  @keyframes puff { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -26px); } }

  /* Ruleta */
  .wheel-wrap { position: relative; width: 260px; height: 260px; margin: 0 auto; }
  .wheel { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 8px 24px rgba(184,58,107,.3); transition: transform 4s cubic-bezier(.12,.7,.1,1); }
  .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid #b83a6b; z-index: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }

  .polaroid { background: #fff; padding: 8px 8px 22px; box-shadow: 0 6px 14px rgba(184,58,107,.2); }
  .polaroid .ph { aspect-ratio: 1; background: #ffd6e4; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; overflow: hidden; }
  .polaroid img { width: 100%; height: 100%; object-fit: cover; }
  .vale.used { opacity: .55; }
  .vale.used .vt { text-decoration: line-through; }

  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0; transition: all .4s; z-index: 80; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    .floaty { display: none; }
  }
</style>
</head>
<body>
<div class="bunting" id="bunting" aria-hidden="true"></div>
<div id="floaties" aria-hidden="true"></div>
<canvas id="confetti" class="fixed inset-0 z-[70] pointer-events-none" aria-hidden="true"></canvas>
<div id="toast" class="bg-berry text-white font-semibold text-sm px-5 py-3 rounded-full shadow-xl"></div>

<main class="relative z-10 min-h-screen flex items-center justify-center px-5 pt-12 pb-8">

  <!-- ============ PANTALLA 1: CÓDIGO SECRETO ============ -->
  <section id="lock" class="screen w-full max-w-sm text-center">
    <div class="flex items-center justify-center gap-3 mb-4">
      <div id="photo1" class="frame w-24 h-24 rounded-full flex items-center justify-center -rotate-6"></div>
      <span class="text-4xl pulse-heart">🎂</span>
      <div id="photo2" class="frame w-24 h-24 rounded-full flex items-center justify-center rotate-6"></div>
    </div>
    <h1 class="font-script text-4xl sm:text-5xl text-berry leading-tight">¡Hoy es tu día!</h1>
    <p class="mt-1 text-sm text-cocoa/80 flex items-center justify-center gap-1.5">
      <i data-lucide="lock" class="w-4 h-4"></i> Ingresa el código secreto de 4 dígitos
    </p>
    <div id="dots" class="flex justify-center gap-4 my-5" aria-live="polite">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div id="pad" class="grid grid-cols-3 gap-3 px-3"></div>
    <p id="hint" class="mt-4 text-sm h-5 text-berry font-semibold"></p>
  </section>

  <!-- ============ PANTALLA 2: SORPRESAS ============ -->
  <section id="gifts" class="screen hidden-screen w-full max-w-md text-center">
    <p id="bdayLine" class="font-script text-3xl text-rosa"></p>
    <h2 class="font-script text-4xl sm:text-5xl text-berry leading-tight">¡Desbloqueaste tus sorpresas!</h2>
    <div id="counter" class="hidden mt-3 inline-block bg-white/80 border-2 border-blush rounded-full px-4 py-1 text-sm font-semibold text-berry"></div>

    <div class="mt-4 mb-5 mx-auto max-w-xs">
      <div class="flex justify-between text-xs font-bold text-berry mb-1"><span>Sorpresas abiertas</span><span id="progTxt">0 de 6</span></div>
      <div class="h-3 rounded-full bg-white border-2 border-blush overflow-hidden"><div id="progBar" class="h-full bg-rosa rounded-full transition-all duration-500" style="width:0%"></div></div>
    </div>

    <div id="giftGrid" class="grid grid-cols-2 gap-4 px-1"></div>
  </section>
</main>

<!-- ============ MODAL ============ -->
<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-cocoa/40 backdrop-blur-sm opacity-0 pointer-events-none" role="dialog" aria-modal="true">
  <div class="panel relative w-full max-w-md max-h-[92vh] overflow-y-auto rounded-[2rem] bg-petal border-4 border-white p-5 shadow-2xl">
    <button class="close-btn absolute top-3 right-3 rounded-full bg-white/90 p-2 text-berry z-10" id="closeBtn" aria-label="Cerrar">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
    <div id="modalBody" class="pt-6"></div>
  </div>
</div>

    { src: IMGS.img1, cap: "Mi cumpleañera" }, { src: IMGS.img2, cap: "Juntitos" }, { src: IMGS.img3, cap: "De paseo" },
    { src: IMGS.img4, cap: "Mi favorita" }, { src: IMGS.img5, cap: "Qué risa" }, { src: IMGS.img6, cap: "Selfie" }
  ];

  /* ================= UTILIDADES ================= */
  const $ = (s, el = document) => el.querySelector(s);
  const icons = () => { try { window.lucide && lucide.createIcons(); } catch (e) {} };
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

  // Banderines
  (function () {
    const cols = ['#f472a0', '#ffc2d4', '#ffd6a5', '#fff', '#c6a6ff', '#9be7ff'];
    $('#bunting').innerHTML = Array.from({ length: 14 }, (_, i) => `<span class="flag" style="border-top-color:${cols[i % cols.length]};animation-delay:${(i % 5) * .3}s"></span>`).join('');
  })();

  // Globos y cositas flotando
  (function () {
    const box = $('#floaties'), set = ['🎈', '🎀', '🌸', '🎉', '💗', '✨'];
    const spawn = () => {
      const s = document.createElement('span'); s.className = 'floaty';
      s.textContent = set[Math.floor(Math.random() * set.length)];
      s.style.left = Math.random() * 100 + 'vw'; s.style.fontSize = (16 + Math.random() * 20) + 'px';
      s.style.animationDuration = (9 + Math.random() * 8) + 's';
      box.appendChild(s); setTimeout(() => s.remove(), 18000);
    };
    for (let i = 0; i < 6; i++) setTimeout(spawn, i * 500);
    setInterval(spawn, 1400);
  })();

  // Confeti
  const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], raf = 0;
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; addEventListener('resize', fit); fit();
  function confetti(n = 120, ox = innerWidth / 2, oy = innerHeight * .35) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cols = ['#f472a0', '#ffc2d4', '#ffd54f', '#9be7ff', '#c6a6ff', '#ffffff'];
    for (let i = 0; i < n; i++) parts.push({ x: ox, y: oy, vx: (Math.random() - .5) * 14, vy: Math.random() * -13 - 3, s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)] });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < cv.height + 20);
    parts.forEach(p => { p.vy += .32; p.x += p.vx; p.vx *= .99; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }

  // Fotos del candado
  function setPhoto(id, url, emoji) {
    const el = $(id), fallback = () => { el.innerHTML = `<span class="text-4xl">${emoji}</span>`; };
    if (!url) return fallback();
    const img = new Image(); img.alt = 'Foto'; img.src = url; img.onerror = fallback; el.appendChild(img);
  }
  setPhoto('#photo1', PHOTO_1, '🧸'); setPhoto('#photo2', PHOTO_2, '🐰');

  /* ================= TECLADO ================= */
  let entered = '', locked = false;
  const pad = $('#pad'), dots = [...document.querySelectorAll('.dot')], hint = $('#hint');
  ['1','2','3','4','5','6','7','8','9','clear','0','del'].forEach(k => {
    const b = document.createElement('button'); b.className = 'key'; b.type = 'button'; b.dataset.k = k;
    b.innerHTML = k === 'del' ? '<i data-lucide="delete" class="w-6 h-6 mx-auto"></i>' : k === 'clear' ? '<span class="text-base">🧹</span>' : k;
    b.setAttribute('aria-label', k === 'del' ? 'Borrar' : k === 'clear' ? 'Limpiar' : k);
    pad.appendChild(b);
  });
  const paint = () => dots.forEach((d, i) => d.classList.toggle('on', i < entered.length));
  function press(k) {
    if (locked) return; hint.textContent = '';
    if (k === 'del') entered = entered.slice(0, -1); else if (k === 'clear') entered = ''; else if (entered.length < 4) entered += k;
    paint(); if (entered.length === 4) check();
  }
  function check() {
    locked = true;
    if (entered === SECRET_CODE) { hint.textContent = '¡Correcto! 🎉'; confetti(90, innerWidth / 2, innerHeight * .5); setTimeout(unlock, 700); }
    else { $('#dots').classList.add('shake'); hint.textContent = 'Ese no es, intenta de nuevo 🙈';
      setTimeout(() => { $('#dots').classList.remove('shake'); entered = ''; paint(); locked = false; }, 600); }
  }
  pad.addEventListener('click', e => { const b = e.target.closest('.key'); if (b) press(b.dataset.k); });
  document.addEventListener('keydown', e => {
    if ($('#lock').classList.contains('hidden-screen')) return;
    if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del');
  });
  function unlock() {
    const lock = $('#lock'), g = $('#gifts');
    lock.classList.add('leave');
    setTimeout(() => {
      lock.classList.add('hidden-screen'); g.classList.remove('hidden-screen'); g.classList.add('pre-enter');
      void g.offsetWidth; g.classList.remove('pre-enter'); icons();
      confetti(140, innerWidth / 2, innerHeight * .25);
    }, 650);
  }

  /* ================= PANTALLA DE SORPRESAS ================= */
  $('#bdayLine').textContent = `¡Feliz cumpleaños${NAME ? ', ' + NAME : ''}! 🎂${AGE ? ' ' + AGE + ' añitos ✨' : ''}`;
  if (START_DATE) {
    const d = Math.floor((Date.now() - new Date(START_DATE + 'T00:00:00')) / 864e5);
    if (d >= 0) { const c = $('#counter'); c.textContent = `💞 Llevamos ${d.toLocaleString('es')} días juntos`; c.classList.remove('hidden'); }
  }

  const GIFTS = [
    { id: 1, e: '🎁', t: 'Música', s: 'Para tus oídos' },
    { id: 2, e: '💌', t: 'Cartita', s: 'Solo para ti' },
    { id: 4, e: '🎂', t: 'Pastel', s: 'Pide un deseo' },
    { id: 5, e: '🎡', t: 'Ruleta', s: 'Gira y gana' },
    { id: 7, e: '📸', t: 'Recuerdos', s: 'Nuestras fotos', wide: true },
    { id: 3, e: '🚗', t: 'La última sorpresa', s: 'Ábrela al final', final: true }
  ];
  const opened = new Set(store.get('bday_opened', []));
  let celebrated = store.get('bday_celebrated', false);
  const grid = $('#giftGrid');
  grid.innerHTML = GIFTS.map(g => `
    <button class="gift ${g.final ? 'final col-span-2' : g.wide ? 'col-span-2' : ''}" data-gift="${g.id}" aria-label="Abrir ${g.t}">
      <span class="badge"><i data-lucide="check" class="w-4 h-4"></i></span>
      <span class="box">${g.e}</span>
      <span class="font-bold text-berry text-lg leading-tight">${g.t}</span>
      <span class="text-xs text-cocoa/70 sub">${g.s}</span>
    </button>`).join('');

  function progress() {
    const n = opened.size; $('#progTxt').textContent = `${n} de 6`; $('#progBar').style.width = (n / 6 * 100) + '%';
    document.querySelectorAll('.gift').forEach(b => {
      const id = +b.dataset.gift; b.classList.toggle('done', opened.has(id));
      if (id === 3) {
        const ready = [1, 2, 4, 5, 7].every(x => opened.has(x));
        b.classList.toggle('locked', !ready);
        $('.sub', b).textContent = ready ? '¡Ya puedes abrirla! 🎉' : '🔒 Abre las demás primero';
      }
    });
  }
  progress(); icons();

  /* ================= CONTENIDO DE CADA SORPRESA ================= */
  let cleanup = null;
  const G = {
    1: () => ({ html: `
      <div class="text-center">
        <h3 class="font-script text-3xl text-berry mb-3">Música para tu día 🎶</h3>
        <div class="aspect-video w-full rounded-2xl overflow-hidden border-4 border-white shadow-lg bg-black">
          <iframe class="w-full h-full" title="Canción para ti" src="https://www.youtube.com/embed/${YOUTUBE_ID}?autoplay=1&rel=0&playsinline=1"
            allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        </div>
        <p class="font-script text-4xl sm:text-5xl text-berry mt-5 leading-tight">Me encantan tus ojos <span class="pulse-heart">👀💗</span></p>
      </div>` }),

    2: () => ({ html: `
      <div class="text-center">
        <h3 class="font-script text-3xl text-berry mb-3">Una cartita para ti 💌</h3>
        <div class="letter text-left text-[1.05rem] font-medium text-cocoa">
          Me encanta absolutamente todo de ti. Eres la mujerecita más especial y hermosa. Y bueno, no voy a mentir... ¡me encanta tu cola jsjs! Te amo muchísimo.
          <div class="font-script text-2xl text-berry text-right mt-1">¡Feliz cumple! 🎉</div>
        </div>
      </div>` }),

    3: () => ({ html: `
      <div class="text-center py-6">
        <div class="text-6xl mb-3 pulse-heart">🚗</div>
        <p class="font-script text-5xl text-berry leading-tight">Abre la cajuela 🚗🎁</p>
      </div>`, init: () => confetti(160) }),

    4: () => ({ html: `
      <div class="text-center">
        <h3 class="font-script text-3xl text-berry">Pide un deseo 🎂</h3>
        <p id="cakeMsg" class="text-sm text-cocoa/80 mt-1 mb-4">Toca las velitas para apagarlas, o sopla al micrófono 🎤</p>
        <div class="candles" id="candles">
          ${[0,1,2].map(i => `<button class="candle-btn" data-i="${i}" aria-label="Apagar vela ${i+1}"><span class="candle"><span class="flame">🔥</span></span></button>`).join('')}
        </div>
        <div class="cake-top"></div><div class="cake-bot"></div>
        <div class="flex justify-center gap-3 mt-8">
          <button class="btn" id="blowBtn">🎤 Soplar</button>
          <button class="btn alt" id="relight">🕯️ Encender</button>
        </div>
      </div>`, init: initCake }),

    5: () => ({ html: `
      <div class="text-center">
        <h3 class="font-script text-3xl text-berry mb-4">Ruleta de premios 🎡</h3>
        <div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" class="wheel" width="520" height="520"></canvas></div>
        <p id="prize" class="mt-5 min-h-[3rem] font-bold text-berry text-lg">¡Gira para ver qué te toca!</p>
        <button class="btn" id="spin">Girar 🎲</button>
      </div>`, init: initWheel }),

    7: () => ({ html: `
      <div class="text-center">
        <h3 class="font-script text-3xl text-berry mb-4">Nuestros recuerdos 📸</h3>
        <div class="grid grid-cols-2 gap-4 px-1">
          ${MEMORIES.map((m, i) => `
            <figure class="polaroid ${i % 2 ? 'rotate-2' : '-rotate-2'}">
              <div class="ph">${m.src ? `<img src="${m.src}" alt="${m.cap}" onerror="this.replaceWith('📷')">` : '📷'}</div>
            </figure>`).join('')}
        </div>
      </div>` })
  };

  /* --- Pastel --- */
  function initCake() {
    const c = [...document.querySelectorAll('.candle')], msg = $('#cakeMsg');
    let mic = null, ctx = null;
    const stopMic = () => { if (mic) { mic.getTracks().forEach(t => t.stop()); mic = null; } if (ctx) { ctx.close(); ctx = null; } };
    const check = () => { if (c.every(x => x.classList.contains('out'))) { msg.textContent = '¡Deseo en camino! ✨ Que se te cumpla todo 🎉'; confetti(180); stopMic(); } };
    const snuff = el => { if (!el.classList.contains('out')) { el.classList.add('out'); check(); } };
    document.querySelectorAll('.candle-btn').forEach(b => b.addEventListener('click', () => snuff(c[+b.dataset.i])));
    $('#relight').addEventListener('click', () => { c.forEach(x => x.classList.remove('out')); msg.textContent = 'Toca las velitas para apagarlas, o sopla al micrófono 🎤'; });
    $('#blowBtn').addEventListener('click', async () => {
      try {
        stopMic();
        mic = await navigator.mediaDevices.getUserMedia({ audio: true });
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const an = ctx.createAnalyser(); an.fftSize = 512; ctx.createMediaStreamSource(mic).connect(an);
        const d = new Uint8Array(an.fftSize); let hits = 0; msg.textContent = '¡Sopla fuerte! 💨';
        (function loop() {
          if (!mic) return;
          an.getByteTimeDomainData(d); let s = 0; for (const v of d) { const x = (v - 128) / 128; s += x * x; }
          hits = Math.sqrt(s / d.length) > .18 ? hits + 1 : Math.max(0, hits - 1);
          if (hits > 6) { c.forEach((x, i) => setTimeout(() => snuff(x), i * 250)); stopMic(); return; }
          requestAnimationFrame(loop);
        })();
      } catch (e) { msg.textContent = 'No pude usar el micrófono, toca las velitas 🕯️'; }
    });
    cleanup = stopMic;
  }

  /* --- Ruleta --- */
  function initWheel() {
    const cvs = $('#wheel'), x = cvs.getContext('2d'), n = PRIZES.length, r = cvs.width / 2, a = 2 * Math.PI / n;
    const cols = ['#ffd1e1', '#ffffff', '#ffb3cd', '#ffe9f0'];
    PRIZES.forEach((p, i) => {
      x.beginPath(); x.moveTo(r, r); x.arc(r, r, r - 4, -Math.PI / 2 + i * a, -Math.PI / 2 + (i + 1) * a); x.closePath();
      x.fillStyle = cols[i % 4]; x.fill(); x.strokeStyle = '#f472a0'; x.lineWidth = 3; x.stroke();
      x.save(); x.translate(r, r); x.rotate(i * a + a / 2); x.font = '48px serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(p.e, 0, -r * .68); x.restore();
    });
    let rot = 0, spinning = false;
    $('#spin').addEventListener('click', () => {
      if (spinning) return; spinning = true; $('#prize').textContent = '🎶 ¡Girando!...';
      const i = Math.floor(Math.random() * n), per = 360 / n;
      const target = 360 - (i * per + per / 2) + (Math.random() - .5) * per * .6, cur = rot % 360;
      rot += 360 * 5 + (((target - cur) % 360) + 360) % 360;
      cvs.style.transform = `rotate(${rot}deg)`;
      setTimeout(() => { spinning = false; $('#prize').textContent = `🎉 ¡Te tocó: ${PRIZES[i].t}!`; confetti(100); }, 4200);
    });
  }

  /* ================= MODAL ================= */
  const modal = $('#modal'), body = $('#modalBody'); let lastBtn = null;
  document.querySelectorAll('.gift').forEach(btn => btn.addEventListener('click', () => {
    const id = +btn.dataset.gift;
    if (btn.classList.contains('locked')) {
      btn.classList.add('shake'); setTimeout(() => btn.classList.remove('shake'), 500);
      return toast('Primero abre las otras sorpresas 🔒');
    }
    lastBtn = btn; btn.classList.add('opening');
    setTimeout(() => {
      btn.classList.remove('opening');
      const g = G[id](); body.innerHTML = g.html; icons(); modal.classList.add('show'); $('#closeBtn').focus();
      g.init && g.init();
      opened.add(id); store.set('bday_opened', [...opened]); progress();
    }, 550);
  }));

  function closeModal() {
    modal.classList.remove('show');
    if (cleanup) { cleanup(); cleanup = null; }
    setTimeout(() => { body.innerHTML = ''; }, 300);   // detiene el video al cerrar
    if (lastBtn) lastBtn.focus();
    if (opened.size === 6 && !celebrated) {
      celebrated = true; store.set('bday_celebrated', true);
      setTimeout(() => { confetti(200, innerWidth * .25); confetti(200, innerWidth * .75); toast('¡Feliz cumpleaños! 🎉🎂'); }, 400);
    }
  }
  $('#closeBtn').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('show')) closeModal(); });
  icons();
</script>
</body>
</html>
